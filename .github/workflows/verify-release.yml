name: Verify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Doğrulanacak sürüm etiketi"
        required: false
        default: V1
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify release assets and site links
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'V1' }}
          WAIT_ATTEMPTS: "30"
          WAIT_SECONDS: "10"
        run: node scripts/verify-release.mjs
