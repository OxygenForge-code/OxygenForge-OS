<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b110c"/>
      <stop offset="0.52" stop-color="#120b08"/>
      <stop offset="1" stop-color="#28160e"/>
    </linearGradient>
    <radialGradient id="ember" cx="72%" cy="34%" r="58%">
      <stop offset="0" stop-color="#c7783e" stop-opacity="0.50"/>
      <stop offset="0.34" stop-color="#8a4a26" stop-opacity="0.24"/>
      <stop offset="0.72" stop-color="#3a2013" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1b110c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0c4"/>
      <stop offset="0.42" stop-color="#f0b184"/>
      <stop offset="0.78" stop-color="#d07a3b"/>
      <stop offset="1" stop-color="#a94f22"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b184" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f0b184" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#f0b184" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#base)"/>
  <rect width="2560" height="1440" fill="url(#grid)"/>
  <rect width="2560" height="1440" fill="url(#ember)"/>

  <!-- Forge rings -->
  <g fill="none" stroke="#f0b184">
    <circle cx="1840" cy="470" r="430" stroke-opacity="0.055" stroke-width="2"/>
    <circle cx="1840" cy="470" r="352" stroke-opacity="0.09" stroke-width="2"/>
    <circle cx="1840" cy="470" r="274" stroke-opacity="0.15" stroke-width="2"/>
    <circle cx="1840" cy="470" r="196" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="3 10"/>
  </g>

  <!-- Glow behind the mark -->
  <g transform="translate(1840 470)" filter="url(#soft)" opacity="0.75">
    <circle r="210" fill="#b9602c" opacity="0.22"/>
    <circle r="96" fill="#f0b184" opacity="0.20"/>
  </g>

  <!-- The forge spark: ring + four-point star -->
  <g transform="translate(1840 470)">
    <circle r="150" fill="none" stroke="url(#mark)" stroke-width="11"/>
    <path d="M 0 -132 L 40 -40 L 132 0 L 40 40 L 0 132 L -40 40 L -132 0 L -40 -40 Z"
          fill="url(#mark)" opacity="0.96"/>
    <circle cx="0" cy="0" r="21" fill="#1b110c" opacity="0.92"/>
    <circle cx="228" cy="-188" r="13" fill="#f0b184" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <g>
    <rect x="184" y="1160" width="388" height="2" fill="url(#rule)"/>
    <text x="184" y="1096" fill="#f6ece4" font-family="'DejaVu Sans','Noto Sans',sans-serif"
          font-size="92" font-weight="300" letter-spacing="10">OxygenForgeOS</text>
    <text x="188" y="1208" fill="#c9a68e" font-family="'DejaVu Sans','Noto Sans',sans-serif"
          font-size="25" letter-spacing="9">FORGE 1.0</text>
    <text x="188" y="1260" fill="#8f7767" font-family="'DejaVu Sans','Noto Sans',sans-serif"
          font-size="23" letter-spacing="3">Gizlilik odaklı Linux</text>
  </g>

  <rect width="2560" height="1440" fill="url(#vignette)"/>
</svg>
