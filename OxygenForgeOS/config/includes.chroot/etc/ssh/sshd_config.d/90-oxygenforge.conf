# OxygenForgeOS SSH defaults. The service is disabled until the administrator
# enables it; see docs/SERVER.md.
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
