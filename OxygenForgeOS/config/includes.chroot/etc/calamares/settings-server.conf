---
# OxygenForgeOS Server installer sequence: no desktop, no display manager.
modules-search:
  - local
  - /usr/lib/calamares/modules

instances:
  - id: packages
    module: packages
    config: packages-server.conf
  - id: services
    module: services
    config: services-server.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - users
      - packages
      - networkcfg
      - services
      - grubcfg
      - bootloader
      - initramfs
      - hwclock
      - umount
  - show:
      - finished

branding: oxygenforge
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
