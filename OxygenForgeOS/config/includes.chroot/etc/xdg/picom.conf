# OxygenForgeOS liquid glass compositor.
# xfwm4's own compositor is disabled by oxygenforge-liquid at login so this
# configuration owns blur, shadows and rounded corners.

backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;

shadow = true;
shadow-radius = 20;
shadow-opacity = 0.38;
shadow-offset-x = 0;
shadow-offset-y = 10;

corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Xfce4-notifyd'"
];

blur-background = true;
blur-method = "dual_kawase";
blur-strength = 7;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "class_g = 'maim'"
];

active-opacity = 0.97;
inactive-opacity = 0.93;
frame-opacity = 0.90;
inactive-opacity-override = false;

log-level = "warn";
