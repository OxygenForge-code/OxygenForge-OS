#!/usr/sbin/nft -f
# OxygenForgeOS default firewall: drop unsolicited inbound traffic.
# OpenSSH is closed by default, including on the server edition. To allow it:
#   nft add rule inet filter input tcp dport 22 accept
# and persist the change in this file.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # DHCP client and DHCPv6 client replies
        udp dport 68 accept
        udp dport 546 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
