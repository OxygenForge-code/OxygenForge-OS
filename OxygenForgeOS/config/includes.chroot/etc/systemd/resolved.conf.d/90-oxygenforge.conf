[Resolve]
# Encrypted DNS by default. Quad9 is an independent, privacy-focused resolver;
# queries never reach an OxygenForge server. The Privacy Center can switch this
# off, and users can point DNS at their own resolver.
DNS=9.9.9.9#dns.quad9.net 2620:fe::fe#dns.quad9.net
FallbackDNS=149.112.112.112#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=yes
DNSSEC=allow-downgrade
Cache=yes
Domains=~.
MulticastDNS=no
LLMNR=no
